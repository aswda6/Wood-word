<!DOCTYPE html>
<html lang="ckb">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wood World - ستینگ</title>
    <style>
        /* ===== ڕێسا بنەڕەتییەکان ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== فۆنتی کوردی ===== */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap');

        @font-face {
            font-family: 'Peshang Kurdish';
            src: url('https://cdn.jsdelivr.net/gh/ew3sha/ew3sha-fonts@main/Peshang/Peshang-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Peshang Kurdish';
            src: url('https://cdn.jsdelivr.net/gh/ew3sha/ew3sha-fonts@main/Peshang/Peshang-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
        }
        @font-face {
            font-family: 'Peshang Kurdish';
            src: url('https://cdn.jsdelivr.net/gh/ew3sha/ew3sha-fonts@main/Peshang/Peshang-Light.woff2') format('woff2');
            font-weight: 300;
            font-style: normal;
        }

        body {
            font-family: 'Peshang Kurdish', 'Noto Naskh Arabic', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            background: #1a0f0a;
            overflow-x: hidden;
            position: relative;
            direction: rtl;
            transition: background-color 0.5s ease;
        }

        /* ===== باکگراوندی جوڵاوی قاوەیی (دەگۆڕێت) ===== */
        .wood-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .wood-bg .bg-layer {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(120, 70, 40, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 30%, rgba(90, 55, 30, 0.20) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(140, 90, 50, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 30% 20%, rgba(100, 60, 35, 0.10) 0%, transparent 40%),
                linear-gradient(145deg, #1a0f0a, #251810, #1a0f0a, #2d1a0e);
            background-size: 100% 100%;
            animation: woodGlow 10s ease-in-out infinite alternate;
            transition: opacity 0.8s ease;
        }

        .wood-bg.hidden {
            opacity: 0;
        }

        @keyframes woodGlow {
            0% {
                background:
                    radial-gradient(ellipse at 20% 50%, rgba(120, 70, 40, 0.25) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 30%, rgba(90, 55, 30, 0.20) 0%, transparent 50%),
                    radial-gradient(ellipse at 50% 80%, rgba(140, 90, 50, 0.15) 0%, transparent 50%),
                    radial-gradient(ellipse at 30% 20%, rgba(100, 60, 35, 0.10) 0%, transparent 40%),
                    linear-gradient(145deg, #1a0f0a, #251810, #1a0f0a, #2d1a0e);
            }
            33% {
                background:
                    radial-gradient(ellipse at 60% 40%, rgba(130, 80, 45, 0.30) 0%, transparent 55%),
                    radial-gradient(ellipse at 20% 70%, rgba(80, 50, 25, 0.20) 0%, transparent 50%),
                    radial-gradient(ellipse at 80% 60%, rgba(150, 100, 60, 0.15) 0%, transparent 45%),
                    radial-gradient(ellipse at 40% 10%, rgba(110, 65, 40, 0.12) 0%, transparent 40%),
                    linear-gradient(145deg, #251810, #1a0f0a, #2d1a0e, #1a0f0a);
            }
            66% {
                background:
                    radial-gradient(ellipse at 70% 20%, rgba(140, 90, 50, 0.25) 0%, transparent 50%),
                    radial-gradient(ellipse at 30% 80%, rgba(100, 60, 35, 0.25) 0%, transparent 55%),
                    radial-gradient(ellipse at 50% 30%, rgba(160, 110, 70, 0.12) 0%, transparent 50%),
                    radial-gradient(ellipse at 80% 70%, rgba(120, 70, 40, 0.10) 0%, transparent 40%),
                    linear-gradient(145deg, #1a0f0a, #2d1a0e, #251810, #1a0f0a);
            }
            100% {
                background:
                    radial-gradient(ellipse at 40% 60%, rgba(110, 65, 40, 0.30) 0%, transparent 55%),
                    radial-gradient(ellipse at 60% 80%, rgba(130, 80, 45, 0.20) 0%, transparent 50%),
                    radial-gradient(ellipse at 20% 30%, rgba(90, 55, 30, 0.15) 0%, transparent 45%),
                    radial-gradient(ellipse at 70% 50%, rgba(150, 100, 60, 0.10) 0%, transparent 40%),
                    linear-gradient(145deg, #2d1a0e, #1a0f0a, #251810, #1a0f0a);
            }
        }

        /* ===== تەختەکانی قاوەیی ===== */
        .wood-particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            transition: opacity 0.8s ease;
        }

        .wood-particles.hidden {
            opacity: 0;
        }

        .particle {
            position: absolute;
            background: radial-gradient(ellipse, rgba(160, 110, 70, 0.06), rgba(100, 65, 35, 0.02));
            border-radius: 50% 50% 40% 60% / 60% 40% 50% 50%;
            animation: floatParticle 14s infinite alternate ease-in-out;
            box-shadow: inset 0 0 80px rgba(139, 90, 50, 0.04), 0 0 40px rgba(100, 65, 35, 0.02);
        }
        .particle:nth-child(1) { width: 400px; height: 280px; top: 5%; left: -8%; animation-duration: 16s; animation-delay: 0s; transform: rotate(15deg); }
        .particle:nth-child(2) { width: 500px; height: 300px; bottom: 0%; right: -12%; animation-duration: 20s; animation-delay: 2s; transform: rotate(-20deg); }
        .particle:nth-child(3) { width: 250px; height: 350px; top: 40%; left: 30%; animation-duration: 18s; animation-delay: 4s; transform: rotate(40deg); }
        .particle:nth-child(4) { width: 200px; height: 300px; top: 15%; right: 10%; animation-duration: 22s; animation-delay: 1s; transform: rotate(-35deg); }
        .particle:nth-child(5) { width: 450px; height: 200px; bottom: 15%; left: 15%; animation-duration: 17s; animation-delay: 3s; transform: rotate(8deg); }
        .particle:nth-child(6) { width: 180px; height: 400px; top: 50%; right: 30%; animation-duration: 19s; animation-delay: 5s; transform: rotate(25deg); }

        @keyframes floatParticle {
            0% { transform: translate(0,0) rotate(0deg) scale(1); opacity: 0.5; }
            25% { transform: translate(35px,-50px) rotate(6deg) scale(1.06); opacity: 0.8; }
            50% { transform: translate(-25px,40px) rotate(-4deg) scale(0.94); opacity: 0.6; }
            75% { transform: translate(45px,25px) rotate(5deg) scale(1.03); opacity: 0.9; }
            100% { transform: translate(-35px,-30px) rotate(-3deg) scale(1); opacity: 0.5; }
        }

        /* ===== لقی دار ===== */
        .branches {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.06;
            transition: opacity 0.8s ease;
        }
        .branches.hidden {
            opacity: 0;
        }
        .branches svg { width: 100%; height: 100%; }

        /* ===== مێنوو ===== */
        .menu-toggle {
            position: fixed;
            top: 24px;
            right: 28px;
            z-index: 1000;
            background: rgba(212, 163, 115, 0.06);
            border: 1px solid rgba(212, 163, 115, 0.08);
            color: rgba(212, 163, 115, 0.4);
            font-size: 28px;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.4s ease;
            border-radius: 0;
            font-family: 'Peshang Kurdish', 'Noto Naskh Arabic', sans-serif;
            line-height: 1;
        }

        .menu-toggle:hover {
            background: rgba(212, 163, 115, 0.12);
            border-color: rgba(212, 163, 115, 0.2);
            color: #d4a373;
            transform: scale(1.04);
        }

        .menu-dropdown {
            position: fixed;
            top: 0;
            right: -320px;
            width: 280px;
            height: 100vh;
            z-index: 999;
            background: rgba(13, 8, 5, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid rgba(212, 163, 115, 0.06);
            padding: 80px 30px 40px;
            transition: right 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: -20px 0 60px rgba(0, 0, 0, 0.4);
        }

        .menu-dropdown.open {
            right: 0;
        }

        .menu-dropdown .close-menu {
            position: absolute;
            top: 20px;
            left: 24px;
            background: none;
            border: none;
            color: rgba(212, 163, 115, 0.2);
            font-size: 28px;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .menu-dropdown .close-menu:hover {
            color: rgba(212, 163, 115, 0.5);
            transform: rotate(90deg);
        }

        .menu-dropdown .menu-brand-side {
            font-family: 'Peshang Kurdish', 'Noto Naskh Arabic', serif;
            font-size: 20px;
            font-weight: 700;
            color: transparent;
            background: linear-gradient(135deg, #d4a373, #f5e6ca, #c9956b);
            -webkit-background-clip: text;
            background-clip: text;
            margin-bottom: 30px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(212, 163, 115, 0.04);
        }

        .menu-dropdown a {
            font-family: 'Peshang Kurdish', 'Noto Naskh Arabic', sans-serif;
            color: rgba(212, 163, 115, 0.3);
            text-decoration: none;
            padding: 14px 18px;
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 1px;
            transition: all 0.4s ease;
            border-radius: 0;
            border-right: 2px solid transparent;
        }

        .menu-dropdown a:hover {
            color: #d4a373;
            background: rgba(212, 163, 115, 0.04);
            border-right-color: rgba(212, 163, 115, 0.2);
            padding-right: 24px;
        }

        .menu-dropdown a.active {
            color: #d4a373;
            border-right-color: rgba(212, 163, 115, 0.3);
        }

        .menu-location {
            margin-top: 8px;
            padding: 14px 18px;
            border-top: 1px solid rgba(212, 163, 115, 0.04);
            border-bottom: 1px solid rgba(212, 163, 115, 0.04);
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
            display: block;
        }

        .menu-location:hover {
            background: rgba(212, 163, 115, 0.04);
        }

        .menu-location .loc-label {
            font-family: 'Peshang Kurdish', 'Noto Naskh Arabic', sans-serif;
            color: rgba(212, 163, 115, 0.15);
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .menu-location .loc-text {
            font-family: 'Peshang Kurdish', 'Noto Naskh Arabic', sans-serif;
            color: rgba(212, 163, 115, 0.3);
            font-size: 14px;
            font-weight: 300;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.3s ease;
        }

        .menu-location:hover .loc-text {
            color: #d4a373;
        }

        .menu-location .loc-text .loc-icon {
            color: rgba(212, 163, 115, 0.2);
            font-size: 16px;
        }

        .menu-dropdown .menu-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(212, 163, 115, 0.04);
            color: rgba(212, 163, 115, 0.06);
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 1px;
            text-align: center;
        }

        /* ===== ناوەڕۆکی ستینگ ===== */
        .settings-page {
            position: relative;
            z-index: 1;
            max-width: 640px;
            margin: 80px auto 60px;
            padding: 40px 36px;
            background: rgba(26, 15, 10, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(212, 163, 115, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .settings-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .settings-header h1 {
            font-family: 'Peshang Kurdish', 'Noto Naskh Arabic', serif;
            font-size: clamp(28px, 4vw, 38px);
            font-weight: 700;
            color: transparent;
            background: linear-gradient(135deg, #d4a373, #f5e6ca, #c9956b);
            -webkit-background-clip: text;
            background-clip: text;
            margin-bottom: 6px;
        }

        .settings-header p {
            font-family: 'Peshang Kurdish', 'Noto Naskh Arabic', sans-serif;
            color: rgba(212, 163, 115, 0.3);
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .settings-header .divider {
            width: 50px;
            height: 1px;
            margin: 14px auto;
            background: linear-gradient(90deg, transparent, rgba(212, 163, 115, 0.2), transparent);
        }

        .setting-group {
            margin-bottom: 28px;
            padding-bottom: 28px;
            border-bottom: 1px solid rgba(212, 163, 115, 0.04);
        }

        .setting-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .setting-group label {
            font-family: 'Peshang Kurdish', 'Noto Naskh Arabic', sans-serif;
            display: block;
            font-weight: 500;
            color: rgba(212, 163, 115, 0.5);
            font-size: 14px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .setting-group .setting-desc {
            font-family: 'Peshang Kurdish', 'Noto Naskh Arabic', sans-serif;
            color: rgba(212, 163, 115, 0.15);
            font-size: 12px;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .color-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .color-options .color-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(212, 163, 115, 0.08);
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
        }

        .color-options .color-btn:hover {
            transform: scale(1.12);
            border-color: rgba(212, 163, 115, 0.3);
        }

        .color-options .color-btn.active {
            border-color: #d4a373;
            box-shadow: 0 0 20px rgba(212, 163, 115, 0.15);
        }

        .color-options .color-btn.active::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 16px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
        }

        .pattern-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .pattern-options .pattern-btn {
            padding: 10px 20px;
            border: 1px solid rgba(212, 163, 115, 0.08);
            border-radius: 8px;
            background: rgba(212, 163, 115, 0.02);
            color: rgba(212, 163, 115, 0.3);
            font-family: 'Peshang Kurdish', 'Noto Naskh Arabic', sans-serif;
            font-size: 13px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 0.5px;
        }

        .pattern-options .pattern-btn:hover {
            border-color: rgba(212, 163, 115, 0.2);
            color: rgba(212, 163, 115, 0.5);
            background: rgba(212, 163, 115, 0.04);
        }

        .pattern-options .pattern-btn.active {
            border-color: rgba(212, 163, 115, 0.3);
            color: #d4a373;
            background: rgba(212, 163, 115, 0.06);
        }

        .pattern-options .pattern-btn .pattern-preview {
            display: inline-block;
            width: 30px;
            height: 20px;
            border-radius: 4px;
            margin-left: 8px;
            vertical-align: middle;
            border: 1px solid rgba(212, 163, 115, 0.06);
        }

        .btn-reset {
            font-family: 'Peshang Kurdish', 'Noto Naskh Arabic', sans-serif;
            padding: 10px 28px;
            border: 1px solid rgba(200, 80, 80, 0.1);
            border-radius: 0;
            background: transparent;
            color: rgba(200, 80, 80, 0.3);
            font-size: 13px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .btn-reset:hover {
            border-color: rgba(200, 80, 80, 0.2);
            color: rgba(200, 80, 80, 0.5);
            background: rgba(200, 80, 80, 0.04);
        }

        .footer-info {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 30px 20px 20px;
            color: rgba(212, 163, 115, 0.06);
            font-size: 11px;
            letter-spacing: 2px;
            font-family: 'Peshang Kurdish', 'Noto Naskh Arabic', sans-serif;
            font-weight: 300;
        }

        @media (max-width: 768px) {
            .settings-page {
                margin: 70px 16px 40px;
                padding: 28px 20px;
            }
            .menu-toggle { top: 16px; right: 18px; font-size: 22px; padding: 4px 12px; }
            .menu-dropdown { width: 240px; right: -280px; padding: 70px 20px 30px; }
        }

        @media (max-width: 480px) {
            .settings-page {
                margin: 60px 12px 30px;
                padding: 20px 16px;
            }
            .settings-header h1 { font-size: 24px; }
            .color-options .color-btn { width: 36px; height: 36px; }
            .pattern-options .pattern-btn { padding: 8px 14px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- ===== باکگراوند ===== -->
    <div class="wood-bg" id="woodBg">
        <div class="bg-layer"></div>
    </div>
    <div class="wood-particles" id="woodParticles">
        <div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div>
    </div>
    <div class="branches" id="woodBranches">
        <svg viewBox="0 0 1000 800" preserveAspectRatio="none">
            <path d="M100,800 Q200,600 150,500 Q100,400 200,350 Q300,300 250,200 Q200,100 350,50" stroke="rgba(212,163,115,0.3)" stroke-width="1.5" fill="none"/>

            <path d="M200,350 Q280,380 320,320 Q360,260 420,280" stroke="rgba(212,163,115,0.2)" stroke-width="1" fill="none"/>
            <path d="M900,800 Q850,600 880,500 Q910,400 850,350 Q790,300 820,200 Q850,100 750,40" stroke="rgba(212,163,115,0.3)" stroke-width="1.5" fill="none"/>
            <path d="M820,200 Q780,240 740,210 Q700,180 710,130" stroke="rgba(212,163,115,0.2)" stroke-width="1" fill="none"/>
            <path d="M850,350 Q800,370 770,310 Q740,250 680,270" stroke="rgba(212,163,115,0.2)" stroke-width="1" fill="none"/>
            <path d="M350,50 Q400,80 430,30" stroke="rgba(212,163,115,0.15)" stroke-width="0.8" fill="none"/>
            <path d="M750,40 Q700,70 670,20" stroke="rgba(212,163,115,0.15)" stroke-width="0.8" fill="none"/>
            <path d="M150,500 Q120,450 80,470" stroke="rgba(212,163,115,0.15)" stroke-width="0.8" fill="none"/>
            <path d="M880,500 Q910,450 950,480" stroke="rgba(212,163,115,0.15)" stroke-width="0.8" fill="none"/>
        </svg>
    </div>

    <!-- ===== دوگمەی مێنوو ===== -->
    <button class="menu-toggle" id="menuToggle">☰</button>

    <!-- ===== مێنوو ===== -->
    <nav class="menu-dropdown" id="menuDropdown">
        <button class="close-menu" id="menuClose">✕</button>
        <div class="menu-brand-side">Wood World</div>
        <a href="homepage.html">🏠 پەڕەی سەرەکی</a>
        <a href="gallery.html">🖼️ گەلەری</a>
        <a href="settings.html" class="active">⚙️ ستینگ</a>

        <a href="https://www.google.com/maps/place/Erbil,+Kurdistan+Region/@36.1912,44.0092,12z" 
           class="menu-location" 
           target="_blank">
            <div class="loc-label">📍 شوێن</div>
            <div class="loc-text">
                <span class="loc-icon">📍</span>
                <span>هەولێر، کوردستان</span>
            </div>
        </a>

        <div class="menu-footer">© 2026 Wood World</div>
    </nav>

    <!-- ===== ناوەڕۆکی ستینگ ===== -->
    <main class="settings-page">
        <div class="settings-header">
            <h1>⚙️ ڕێکخستنەکان</h1>
            <div class="divider"></div>
            <p>شێوەی وێبسایتەکە بە دڵی خۆت بگۆڕە</p>
        </div>

        <!-- ===== گروپی ڕەنگ ===== -->
        <div class="setting-group">
            <label>🎨 ڕەنگی پشتەوە</label>
            <p class="setting-desc">ڕەنگێک هەڵبژێرە بۆ پشتەوەی وێبسایت</p>
            <div class="color-options" id="colorOptions">
                <button class="color-btn active" data-color="#1a0f0a" style="background: #1a0f0a;" title="تاریک"></button>
                <button class="color-btn" data-color="#2d1a0e" style="background: #2d1a0e;" title="قهوەیی تاریک"></button>
                <button class="color-btn" data-color="#4a3020" style="background: #4a3020;" title="قهوەیی"></button>
                <button class="color-btn" data-color="#6b4f3a" style="background: #6b4f3a;" title="قهوەیی ڕووناک"></button>
                <button class="color-btn" data-color="#1a1a2e" style="background: #1a1a2e;" title="شەوی"></button>
                <button class="color-btn" data-color="#0a0a0a" style="background: #0a0a0a;" title="ڕەش"></button>
                <button class="color-btn" data-color="#2c1810" style="background: #2c1810;" title="سورەیی تاریک"></button>
                <button class="color-btn" data-color="#3d2b1f" style="background: #3d2b1f;" title="قهوەیی سوور"></button>
            </div>
        </div>

        <!-- ===== گروپی نەخش ===== -->
        <div class="setting-group">
            <label>🖼️ نەخشی پشتەوە</label>
            <p class="setting-desc">نەخشێک هەڵبژێرە بۆ پشتەوە</p>
            <div class="pattern-options" id="patternOptions">
                <button class="pattern-btn active" data-pattern="default">
                    <span class="pattern-preview" style="background: #1a0f0a;"></span>
                    بنەڕەت
                </button>
                <button class="pattern-btn" data-pattern="wood">
                    <span class="pattern-preview" style="background: repeating-linear-gradient(90deg, rgba(139,90,43,0.3) 0px, rgba(160,110,60,0.2) 2px, rgba(120,75,35,0.4) 4px, rgba(100,65,30,0.2) 6px, rgba(139,90,43,0.3) 8px);"></span>
                    نەخشی دار
                </button>
                <button class="pattern-btn" data-pattern="lines">
                    <span class="pattern-preview" style="background: repeating-linear-gradient(45deg, rgba(212,163,115,0.05) 0px, rgba(212,163,115,0.05) 4px, transparent 4px, transparent 8px);"></span>
                    هێڵکاری
                </button>
                <button class="pattern-btn" data-pattern="dots">
                    <span class="pattern-preview" style="background: radial-gradient(circle, rgba(212,163,115,0.08) 1px, transparent 1px); background-size: 12px 12px;"></span>
                    خاڵی
                </button>
                <button class="pattern-btn" data-pattern="none">
                    <span class="pattern-preview" style="background: transparent; border-color: transparent;"></span>
                    بێ نەخش
                </button>
            </div>
        </div>

        <!-- ===== دوگمەی ڕێکخستنەوە ===== -->
        <div class="setting-group" style="border-bottom: none; padding-bottom: 0;">
            <button class="btn-reset" id="resetSettings">↺ گەڕاندنەوەی بنەڕەت</button>
        </div>
    </main>

    <!-- ===== زانیاری خوارەوە ===== -->
    <div class="footer-info">
        <span>© 2026 Wood World • پەڕەی ڕێکخستنەکان</span>
    </div>

    <!-- ===== جاڤاسکریپت ===== -->
    <script>
        // ===== مێنوو =====
        const toggle = document.getElementById('menuToggle');
        const dropdown = document.getElementById('menuDropdown');
        const close = document.getElementById('menuClose');

        toggle.addEventListener('click', function() {
            dropdown.classList.toggle('open');
        });

        close.addEventListener('click', function() {
            dropdown.classList.remove('open');
        });

        document.addEventListener('click', function(e) {
            if (!dropdown.contains(e.target) && e.target !== toggle) {
                dropdown.classList.remove('open');
            }
        });

        // ===== ستینگ =====
        const body = document.body;
        const woodBg = document.getElementById('woodBg');
        const woodParticles = document.getElementById('woodParticles');
        const woodBranches = document.getElementById('woodBranches');
        const colorBtns = document.querySelectorAll('.color-btn');
        const patternBtns = document.querySelectorAll('.pattern-btn');
        const resetBtn = document.getElementById('resetSettings');

        const defaultColor = '#1a0f0a';
        const defaultPattern = 'default';

        // ===== گۆڕینی ڕەنگ =====
        colorBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                colorBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const color = this.dataset.color;
                body.style.backgroundColor = color;
                
                // ئەگەر ڕەنگ تاریک بێت، نەخشی دار و تەختەکان دەشاردرێنەوە
                if (color === '#0a0a0a' || color === '#1a1a2e') {
                    woodBg.classList.add('hidden');
                    woodParticles.classList.add('hidden');
                    woodBranches.classList.add('hidden');
                } else {
                    woodBg.classList.remove('hidden');
                    woodParticles.classList.remove('hidden');
                    woodBranches.classList.remove('hidden');
                }
                
                localStorage.setItem('woodworld_bgcolor', color);
            });
        });

        // ===== گۆڕینی نەخش =====
        patternBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                patternBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const pattern = this.dataset.pattern;
                applyPattern(pattern);
                localStorage.setItem('woodworld_pattern', pattern);
            });
        });

        function applyPattern(pattern) {
            const currentColor = body.style.backgroundColor || defaultColor;
            
            // پاککردنەوەی نەخشەکانی تر
            body.style.backgroundImage = 'none';
            
            if (pattern === 'default') {
                // نەخشی بنەڕەت - تەنها wood-bg دەردەکەوێت
                woodBg.classList.remove('hidden');
                woodParticles.classList.remove('hidden');
                woodBranches.classList.remove('hidden');
                body.style.backgroundColor = currentColor;
            } else if (pattern === 'none') {
                // بێ نەخش - wood-bg دەشاردرێتەوە
                woodBg.classList.add('hidden');
                woodParticles.classList.add('hidden');
                woodBranches.classList.add('hidden');
                body.style.backgroundColor = currentColor;
            } else if (pattern === 'wood') {
                woodBg.classList.add('hidden');
                woodParticles.classList.remove('hidden');
                woodBranches.classList.remove('hidden');
                body.style.backgroundImage = "repeating-linear-gradient(90deg, rgba(139,90,43,0.15) 0px, rgba(160,110,60,0.10) 2px, rgba(120,75,35,0.20) 4px, rgba(100,65,30,0.10) 6px, rgba(139,90,43,0.15) 8px)";
                body.style.backgroundColor = currentColor;
            } else if (pattern === 'lines') {
                woodBg.classList.add('hidden');
                woodParticles.classList.add('hidden');
                woodBranches.classList.add('hidden');
                body.style.backgroundImage = "repeating-linear-gradient(45deg, rgba(212,163,115,0.05) 0px, rgba(212,163,115,0.05) 4px, transparent 4px, transparent 8px)";
                body.style.backgroundColor = currentColor;
            } else if (pattern === 'dots') {
                woodBg.classList.add('hidden');
                woodParticles.classList.add('hidden');
                woodBranches.classList.add('hidden');
                body.style.backgroundImage = "radial-gradient(circle, rgba(212,163,115,0.06) 1px, transparent 1px)";
                body.style.backgroundSize = '16px 16px';
                body.style.backgroundColor = currentColor;
            }
        }

        // ===== گەڕاندنەوەی بنەڕەت =====
        resetBtn.addEventListener('click', function() {
            // گەڕاندنەوەی ڕەنگ
            colorBtns.forEach(b => b.classList.remove('active'));
            document.querySelector('.color-btn[data-color="' + defaultColor + '"]').classList.add('active');
            body.style.backgroundColor = defaultColor;
            localStorage.setItem('woodworld_bgcolor', defaultColor);

            // گەڕاندنەوەی نەخش
            patternBtns.forEach(b => b.classList.remove('active'));
            document.querySelector('.pattern-btn[data-pattern="' + defaultPattern + '"]').classList.add('active');
            woodBg.classList.remove('hidden');
            woodParticles.classList.remove('hidden');
            woodBranches.classList.remove('hidden');
            body.style.backgroundImage = 'none';
            body.style.backgroundSize = 'auto';
            localStorage.setItem('woodworld_pattern', defaultPattern);
        });

        // ===== بارکردنی پاشەکەوتکراوەکان =====
        function loadSettings() {
            const savedColor = localStorage.getItem('woodworld_bgcolor');
            const savedPattern = localStorage.getItem('woodworld_pattern');

            if (savedColor) {
                colorBtns.forEach(b => b.classList.remove('active'));
                const colorBtn = document.querySelector('.color-btn[data-color="' + savedColor + '"]');
                if (colorBtn) {
                    colorBtn.classList.add('active');
                    body.style.backgroundColor = savedColor;
                    if (savedColor === '#0a0a0a' || savedColor === '#1a1a2e') {
                        woodBg.classList.add('hidden');
                        woodParticles.classList.add('hidden');
                        woodBranches.classList.add('hidden');
                    }
                }
            }

            if (savedPattern) {
                patternBtns.forEach(b => b.classList.remove('active'));
                const patternBtn = document.querySelector('.pattern-btn[data-pattern="' + savedPattern + '"]');
                if (patternBtn) {
                    patternBtn.classList.add('active');
                    applyPattern(savedPattern);
                }
            }
        }

        loadSettings();

        console.log('⚙️ Wood World - پەڕەی ستینگ');
    </script>

</body>
</html>
